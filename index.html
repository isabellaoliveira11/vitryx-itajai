<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c2735">
<meta name="description" content="Criativa — economia criativa de Itajaí: descoberta, oportunidades e inteligência de mercado. Uma solução Vitryx.">
<title>VITRYX Criativa · Itajaí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c2735;--ink2:#173947;--ink3:#1d4652;
  --text:#0c2735;--muted:#4f646b;--subtle:#5f7379;
  --line:#e2e9e9;--line2:#d3dddc;--paper:#f4f7f6;--white:#fff;--soft:#f6f9f8;
  --sea:#11a895;--sea-ink:#0a7064;--sea-bg:#ddf3ee;
  --lime:#d8ee6a;--lime-bg:#f4f9df;
  --amber:#e7a13d;--amber-ink:#8a560a;--amber-bg:#fff3dc;
  --coral:#de7057;--coral-ink:#ab3f27;--coral-bg:#fdeee9;
  --blue:#5475bd;--blue-ink:#3c579b;--blue-bg:#e9efff;
  --shadow:0 8px 30px rgba(12,39,53,.06);--shadow-lg:0 25px 80px rgba(6,25,34,.25);
  --r:16px;--r-sm:10px;--r-xs:6px;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea-ink)}
code,.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--sea-ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:256px;background:var(--ink);color:#d7e4e6;padding:22px 14px 16px;display:flex;flex-direction:column;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px;text-decoration:none;color:inherit}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--lime);color:var(--ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:24px;height:24px}
.brand-name{font-size:18px;font-weight:800;letter-spacing:.16em;color:#fff;line-height:1.1}
.brand-sub{font-size:10px;letter-spacing:.14em;color:#9db4b8;text-transform:uppercase;margin-top:3px}
.workspace{margin:0 6px 18px;padding:12px 13px;border:1px solid rgba(255,255,255,.14);border-radius:12px;font-size:12px;color:#b3c7ca}
.workspace b{display:block;color:#f4fbfa;font-size:13px;margin-bottom:2px}
.nav-label{padding:0 12px;margin:14px 0 6px;color:#90abb0;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#c2d3d6;text-decoration:none;font-size:13.5px;font-weight:600;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:#1c434d;color:#fff;box-shadow:inset 3px 0 0 var(--lime)}
.nav a:focus-visible{outline-color:var(--lime)}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--mono);color:#a9c0c4}
.sidebar-bottom{margin-top:auto;padding-top:14px}
.event-chip{margin:0 6px 12px;padding:13px;background:rgba(255,255,255,.06);border-radius:12px;border:1px solid rgba(255,255,255,.09)}
.event-chip .eyebrow{font-size:10px;color:#9db8bd;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
.event-chip strong{display:block;color:#fff;font-size:14px;margin:4px 0 2px}
.event-chip small{color:#b0c4c7;font-size:12px}
.user{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.user b{display:block;font-size:12.5px;color:#fff;line-height:1.3}
.user small{color:#a7bec2;font-size:11px}
.main{margin-left:256px;min-height:100vh}
.topbar{height:64px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.crumb{font-size:13px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:700}
.top-actions{display:flex;align-items:center;gap:10px}
.pill-select{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 8px 6px 12px;font-size:12.5px;color:var(--muted)}
.pill-select select{border:0;background:transparent;font-weight:700;color:var(--ink);padding:2px 2px;max-width:240px}
.pulse{width:8px;height:8px;background:var(--sea);border-radius:50%;box-shadow:0 0 0 3px var(--sea-bg);flex:none}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--ink);border-color:var(--line2)}
.mobile-menu{display:none}
.content{max-width:1440px;margin:0 auto;padding:28px 32px 56px}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.overline{color:var(--sea-ink);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;margin-bottom:6px}
.page-head h1{font-size:32px;line-height:1.12;letter-spacing:-.035em;margin:0 0 6px;font-weight:800}
.page-head p{margin:0;color:var(--muted);font-size:14px;max-width:720px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;margin-bottom:10px}
.back:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line2);background:#fff;border-radius:10px;color:var(--ink);font-size:13px;font-weight:700;padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn svg.i{width:16px;height:16px}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-primary:hover{background:var(--ink2)}
.btn-accent{background:var(--lime);border-color:#c5dc55;color:var(--ink)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--soft);box-shadow:none;color:var(--ink)}
.btn-danger{color:var(--coral-ink);border-color:#f0c9bf}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.link{border:0;background:none;color:var(--sea-ink);font-size:13px;font-weight:750;padding:2px 0;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.link:hover{text-decoration:underline}

/* ---------- grid & cards ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(320px,.85fr);align-items:start}
.split-even{grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);align-items:start}
.mb{margin-bottom:16px}
.grid>*,.stack>*{min-width:0}
#tab-demandas td:first-child,#tab-atores td:first-child{min-width:300px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{padding:18px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-title{font-weight:800;font-size:15.5px;letter-spacing:-.01em;margin:0}
.card-sub{font-size:12.5px;color:var(--subtle);margin-top:3px}
.card-body{padding:0 20px 20px}
.card-pad{padding:20px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;right:-22px;top:-30px;background:var(--tint,var(--sea-bg));opacity:.8}
.kpi-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.kpi-label{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi-icon{width:30px;height:30px;border-radius:9px;background:var(--tint,var(--sea-bg));display:grid;place-items:center;color:var(--accent,var(--sea-ink))}
.kpi-icon svg.i{width:16px;height:16px}
.kpi-value{font-size:32px;letter-spacing:-.045em;font-weight:800;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.kpi-value small{font-size:14px;letter-spacing:0;color:var(--subtle);font-weight:600;margin-left:4px}
.kpi-foot{font-size:12px;color:var(--subtle)}
.kpi-foot b{color:var(--accent,var(--sea-ink));font-weight:800}
.t-sea{--tint:var(--sea-bg);--accent:var(--sea-ink)}
.t-amber{--tint:var(--amber-bg);--accent:var(--amber-ink)}
.t-coral{--tint:var(--coral-bg);--accent:var(--coral-ink)}
.t-blue{--tint:var(--blue-bg);--accent:var(--blue-ink)}
.t-lime{--tint:var(--lime-bg);--accent:var(--ink)}

/* dark signal card */
.signal{background:var(--ink);color:#fff;position:relative;overflow:hidden;border-color:var(--ink)}
.signal:after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(216,238,106,.16);border-radius:50%;right:-80px;bottom:-96px;box-shadow:0 0 0 20px rgba(216,238,106,.03),0 0 0 42px rgba(216,238,106,.03);pointer-events:none}
.signal .card-title{color:#fff}
.signal .card-sub{color:#a5bcc0}
.signal-eyebrow{font-size:11px;color:var(--lime);text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.signal-number{font-size:48px;line-height:1;font-weight:800;letter-spacing:-.06em;margin:10px 0 6px}
.signal-number span{color:var(--lime)}
.signal-caption{color:#c3d3d5;font-size:13.5px;max-width:330px}
.signal-divider{height:1px;background:rgba(255,255,255,.13);margin:16px 0 12px}
.signal-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.signal-stat small{display:block;color:#a0b7bb;font-size:11.5px}
.signal-stat b{font-size:14px}
.signal-foot{font-size:12px;color:#a0b7bb;margin-top:12px}
.signal .btn{background:var(--lime);color:var(--ink);border-color:var(--lime)}

/* ---------- tags / chips ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef4f3;color:var(--muted);white-space:nowrap}
.tag b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:750;white-space:nowrap;line-height:1.35}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st-ok{background:var(--sea-bg);color:var(--sea-ink)}
.st-cond{background:var(--amber-bg);color:var(--amber-ink)}
.st-nao{background:var(--coral-bg);color:var(--coral-ink)}
.st-sem{background:var(--blue-bg);color:var(--blue-ink)}
.st-neu{background:#eef3f2;color:var(--muted)}
.st-ink{background:var(--ink);color:#fff}
.st-lime{background:var(--lime-bg);color:#4d5a12}
.sym{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--r-xs);font-size:12px;font-weight:750;white-space:nowrap}
.sym b{font-family:var(--mono);font-weight:700;font-size:13px;width:12px;text-align:center}
.sym-ok{background:var(--sea-bg);color:var(--sea-ink)}
.sym-cond{background:var(--amber-bg);color:var(--amber-ink)}
.sym-nao{background:var(--coral-bg);color:var(--coral-ink)}
.sym-sem{background:var(--blue-bg);color:var(--blue-ink);box-shadow:inset 0 0 0 1px #c6d3f2}
.ev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ev i{display:inline-flex;gap:2px}
.ev i span{width:6px;height:11px;border-radius:2px;border:1px solid #9fb0b3}
.ev-declarada i span:nth-child(1){background:#7d9196;border-color:#7d9196}
.ev-apresentada i span:nth-child(-n+2){background:var(--blue);border-color:var(--blue)}
.ev-conferida i span{background:var(--sea);border-color:var(--sea)}
.ev-conferida{color:var(--sea-ink)}
.code{font-family:var(--mono);font-size:12px;background:#eef3f2;border-radius:5px;padding:2px 6px;color:var(--ink);white-space:nowrap}
.muted{color:var(--muted)}.subtle{color:var(--subtle);font-size:12.5px}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.right{text-align:right}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.hr{height:1px;background:var(--line);margin:16px 0}

/* ---------- tables ---------- */
.table-wrap{overflow:auto}
.table{border-collapse:collapse;width:100%;min-width:640px}
.table th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--subtle);font-weight:800;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfcfc}
.table td{padding:12px 14px;border-bottom:1px solid #edf2f1;font-size:13.5px;vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr.click{cursor:pointer;transition:background .15s}
.table tbody tr.click:hover{background:#f7fbfa}
.cell-title{font-weight:750;color:var(--ink)}
.cell-sub{font-size:12px;color:var(--subtle);margin-top:2px}
.table-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;color:var(--subtle);font-size:12px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search svg.i{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--subtle)}
.search input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 12px 9px 36px;background:#fff;font-size:13.5px}
select,input,textarea{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:#fff;font-size:13.5px}
.toolbar select{padding-right:28px}
input:focus,select:focus,textarea:focus{border-color:#7fc4b9;box-shadow:0 0 0 3px var(--sea-bg);outline:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:8px 13px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- chain map ---------- */
.chain-map{height:220px;border-radius:14px;background:linear-gradient(140deg,#f3faf8,#ecf5f3);position:relative;overflow:hidden}
.chain-map:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#a8c3bf 1px,transparent 1px);background-size:18px 18px;opacity:.3}
.chain-map svg.lines{position:absolute;inset:0;width:100%;height:100%}
.chain-map svg.lines path{fill:none;stroke-width:1.4;stroke-dasharray:4 4}
.node{position:absolute;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #dfe9e8;border-radius:10px;padding:7px 10px;box-shadow:0 4px 12px rgba(12,39,53,.07);font-size:12px;font-weight:750;white-space:nowrap;z-index:2;transform:translate(-50%,-50%);cursor:pointer;color:var(--ink);text-decoration:none}
.node:hover{border-color:var(--sea)}
.node i{display:block;width:8px;height:8px;border-radius:50%;background:var(--sea)}
.node small{font-family:var(--mono);font-weight:500;color:var(--subtle);font-size:11px}
.node.cond i{background:var(--amber)}.node.nao i{background:var(--coral)}.node.sem i{background:var(--blue)}
.map-caption{position:absolute;bottom:10px;left:14px;color:var(--subtle);font-size:11.5px;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sea);display:inline-block;flex:none}
.dot.cond{background:var(--amber)}.dot.nao{background:var(--coral)}.dot.sem{background:var(--blue)}.dot.neu{background:#a7b6b8}

/* bars */
.bar{height:8px;background:#ecf1f0;border-radius:6px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .ok{background:var(--sea)}.bar .cond{background:var(--amber)}.bar .nao{background:var(--coral)}.bar .sem{background:var(--blue)}.bar .neu{background:#b8c6c5}
.hbar{display:grid;grid-template-columns:minmax(140px,1.1fr) 2fr 44px;gap:12px;align-items:center;padding:8px 0;font-size:13px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.compare-line{display:flex;justify-content:space-between;margin:12px 0 6px;font-size:13px}
.note{padding:12px 14px;border-radius:12px;background:#f2f8f6;color:var(--muted);font-size:13px;line-height:1.55}
.note b{color:var(--ink)}
.note-lime{background:var(--lime-bg);border:1px solid #e5efbd}
.note-amber{background:var(--amber-bg);color:#6b4a12}
.note-coral{background:var(--coral-bg);color:#7d3424}
.note-blue{background:var(--blue-bg);color:#2f4680}

/* ---------- demand header & requirements ---------- */
.dh{overflow:hidden}
.dh-band{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:#eef6f4;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.dh-band .code{background:#fff}
.dh-body{padding:20px}
.dh-title{font-size:24px;line-height:1.2;letter-spacing:-.025em;font-weight:800;margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
.req{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.req-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.req-name{font-weight:750}
.req-kind{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}
.req-kind.must{color:var(--ink)}

/* ---------- matrix ---------- */
.matrix-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:720px;background:#fff}
.matrix th,.matrix td{padding:12px 14px;border-bottom:1px solid #edf2f1;text-align:left;vertical-align:middle}
.matrix thead th{background:#f7faf9;font-size:12px;color:var(--muted);font-weight:700;vertical-align:bottom}
.matrix thead th .code{display:inline-block;margin-top:4px;font-size:11px}
.matrix thead th.req-col{min-width:170px}
.matrix tbody th{font-size:13.5px;font-weight:750;white-space:nowrap}
.matrix tbody th .cell-sub{font-weight:600}
.matrix tbody tr:last-child>*{border-bottom:0}
.matrix tbody tr.sel>*{background:#f1f8f6}
.matrix tbody tr.sel>th{box-shadow:inset 3px 0 0 var(--sea)}
.matrix tbody tr{cursor:pointer}
.matrix .verdict{font-weight:800}
.matrix-legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding-top:12px;font-size:12.5px;color:var(--muted);align-items:center}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#eaf0ef;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.col-head span{font-family:var(--mono);font-weight:600;color:var(--subtle)}
.conn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;cursor:pointer;transition:box-shadow .15s,transform .15s;text-decoration:none;color:inherit}
.conn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.conn-id{font-family:var(--mono);font-size:11.5px;color:var(--subtle)}
.conn-who{font-weight:750;font-size:13.5px;line-height:1.35}
.conn-dem{font-size:12.5px;color:var(--muted);line-height:1.4}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:2px;background:#e5ecec;box-shadow:inset 0 0 0 1px #b9c7c8}
.pips i.on{background:var(--sea);box-shadow:none}
.conn.closed{border-style:dashed;background:#fbfcfc}

/* ---------- timeline / pipeline ---------- */
.pipeline{display:grid;grid-template-columns:repeat(var(--n,5),1fr);margin:6px 0 4px}
.pipe-step{position:relative;text-align:center;padding:0 6px}
.pipe-step:not(:last-child):after{content:"";position:absolute;top:14px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:#dbe5e3}
.pipe-step.complete:not(:last-child):after{background:var(--sea)}
.pipe-circle{width:30px;height:30px;margin:0 auto 8px;border-radius:50%;border:1px solid #cddcd9;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--subtle);position:relative;z-index:1}
.pipe-step.active .pipe-circle{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.pipe-step.complete .pipe-circle{background:var(--sea);border-color:var(--sea);color:#fff}
.pipe-step.fail .pipe-circle{background:var(--coral);border-color:var(--coral);color:#fff}
.pipe-name{font-size:12.5px;font-weight:750}
.pipe-date{font-size:11.5px;color:var(--subtle);margin-top:2px}
.timeline{border-left:2px solid #dbe5e3;margin:6px 0 0 6px;padding-left:20px}
.tl{position:relative;padding:0 0 16px}
.tl:before{content:"";position:absolute;left:-27px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--sea);box-shadow:0 0 0 3px #fff}
.tl.audit:before{background:#9fb1b4}
.tl b{font-size:13.5px}
.tl p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tl small{color:var(--subtle);font-size:12px}

/* fields / sheet */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{padding:12px 14px;border:1px solid var(--line);border-radius:12px;min-width:0}
.field-label{font-size:11px;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.field-value{font-size:14px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.sheet dl{display:grid;grid-template-columns:200px 1fr;margin:0}
.sheet dt,.sheet dd{margin:0;padding:11px 20px;border-top:1px solid var(--line);font-size:13.5px}
.sheet dt{color:var(--subtle);font-weight:700}
.sheet dd{overflow-wrap:anywhere;min-width:0}
.cap{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.cap-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cap-name{font-weight:800;font-size:14.5px}
.rst{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:#fff;font-family:var(--mono);font-size:12px}

/* gates */
.gate-card{padding:18px;position:relative}
.gate-code{font-size:12px;letter-spacing:.12em;color:var(--sea-ink);font-weight:800}
.gate-card h3{margin:8px 0 4px;font-size:16px}
.gate-card p{font-size:13px;color:var(--muted);margin:0}
.gate-card ul{margin:12px 0 0;padding:12px 0 0 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.8}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;font-size:13.5px;font-weight:750;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}

/* empty */
.empty{padding:36px 20px;text-align:center;color:var(--subtle);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- modal ---------- */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(6,25,34,.5);z-index:60;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow:auto}
.modal-backdrop.show{display:flex}
.modal{width:min(640px,100%);background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);animation:fade .2s ease}
.modal.wide{width:min(920px,100%)}
.modal-head{padding:20px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:19px;margin:0;letter-spacing:-.02em}
.modal-head p{font-size:13px;color:var(--subtle);margin:4px 0 0}
.modal-body{padding:18px 22px}
.modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ff{display:grid;gap:5px;min-width:0}
.ff[hidden]{display:none}
.ff.full{grid-column:1/-1}
.ff label,.ff .lbl{font-size:12.5px;font-weight:750;color:var(--muted)}
.ff textarea{min-height:76px;resize:vertical}
.ff .hint{font-size:12px;color:var(--subtle)}
.ff.err input,.ff.err select,.ff.err textarea{border-color:var(--coral)}
.ff .errmsg{font-size:12px;color:var(--coral-ink);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.check input{width:16px;height:16px;padding:0}
.rep{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--soft)}
.rep-row{display:grid;grid-template-columns:1.3fr 90px 100px 90px 34px;gap:8px;align-items:center}
.rep-row input,.rep-row select{padding:7px 9px;font-size:13px}
.rep-head{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
legend{font-size:12.5px;font-weight:800;color:var(--ink);padding:0 6px}

/* toast */
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 12px 35px rgba(12,39,53,.24);font-size:13.5px;z-index:90;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:420px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--coral-ink)}

/* tour */
.tour{position:fixed;z-index:70;right:24px;bottom:24px;width:380px;background:#fff;border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.tour.left{right:auto;left:280px}
.tour-band{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--ink);color:var(--lime);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.tour-band button{border:0;background:transparent;color:#c7d6d8;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.tour-body{padding:16px}
.tour-body h3{margin:0 0 6px;font-size:18px;letter-spacing:-.02em}
.tour-body p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
.tour-tr{margin-top:10px;font-size:12px;color:var(--subtle)}
.tour-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.dots{display:inline-flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:99px;background:#d6e0df}
.dots i.done{background:var(--sea)}
.dots i.now{background:var(--ink);width:20px}
.tour-target{outline:3px solid var(--lime)!important;outline-offset:4px;border-radius:14px;box-shadow:0 0 0 8px rgba(216,238,106,.25)!important;transition:outline .2s}

/* welcome */
.welcome{position:fixed;inset:0;z-index:65;background:rgba(6,25,34,.55);display:none;align-items:center;justify-content:center;padding:20px}
.welcome.show{display:flex}
.welcome-card{width:min(760px,100%);background:var(--ink);color:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);position:relative}
.welcome-card:after{content:"";position:absolute;width:340px;height:340px;border:1px solid rgba(216,238,106,.16);border-radius:50%;right:-120px;top:-150px;box-shadow:0 0 0 30px rgba(216,238,106,.03),0 0 0 62px rgba(216,238,106,.03);pointer-events:none}
.welcome-in{padding:34px 36px 30px;position:relative;z-index:1}
.welcome h2{font-size:34px;line-height:1.1;letter-spacing:-.035em;margin:12px 0 10px;max-width:560px}
.welcome p{color:#c3d3d5;font-size:15px;max-width:580px;margin:0}
.welcome-q{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 24px}
.welcome-q div{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#e3ecec}
.welcome-q b{display:block;color:var(--lime);font-family:var(--mono);font-size:12px;margin-bottom:4px}
.welcome .btn-ghost{color:#d7e4e6}
.welcome .btn-ghost:hover{background:rgba(255,255,255,.08);color:#fff}

/* login */
body.locked .sidebar,body.locked .main{display:none}
.login{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:var(--ink);overflow:auto}
.login.show{display:flex}
.login>.login-card{margin:auto}
.login-card.login-wide{width:min(780px,100%)}
.form-grid>*{min-width:0}
.sheet dd .code{white-space:normal;overflow-wrap:anywhere}
.ad-servicos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;max-height:280px;overflow:auto;padding-right:4px}
.login-join{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.login:before,.login:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(216,238,106,.14);pointer-events:none}
.login:before{width:520px;height:520px;right:-160px;top:-200px;box-shadow:0 0 0 40px rgba(216,238,106,.025),0 0 0 84px rgba(216,238,106,.025)}
.login:after{width:360px;height:360px;left:-140px;bottom:-160px;box-shadow:0 0 0 30px rgba(17,168,149,.04)}
.login-card{position:relative;z-index:1;width:min(420px,100%);background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);padding:30px 28px 22px}
.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.login-name{font-size:24px;font-weight:800;letter-spacing:.18em;line-height:1}
.login-sub{font-size:13px;color:var(--muted);margin-top:5px}
.login-seg{display:grid;grid-template-columns:1fr 1fr;width:100%;margin-bottom:18px}
.login-foot{font-size:12.5px;color:var(--subtle);margin:14px 0 0;text-align:center}
.login-vitryx{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12.5px;color:var(--subtle);letter-spacing:.02em}
.login-vitryx b{color:var(--ink);letter-spacing:.06em}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.page{animation:fade .25s ease}

@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.split-even{grid-template-columns:1fr}
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .25s;box-shadow:none}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vw rgba(6,25,34,.35)}
  .main{margin-left:0}
  .mobile-menu{display:grid}
  .topbar{padding:0 16px}
  .content{padding:20px 16px 40px}
  .page-head{flex-direction:column;align-items:flex-start}
  .page-head h1{font-size:26px}
  .g2,.g3,.g4,.fields,.form-grid{grid-template-columns:1fr}
  .pill-select .lbl{display:none}
  #top-actions .pill-select:first-child,#top-actions .icon-btn:last-child{display:none}
  .pill-select select{max-width:170px}
  .head-actions{justify-content:flex-start}
  .dh-band{gap:6px 12px}
  .matrix-wrap,.table-wrap,.board{max-width:100%}
  .crumb{display:none}
  .welcome-q{grid-template-columns:1fr}
  .tour,.tour.left{left:16px;right:16px;width:auto;bottom:16px}
  .sheet dl{grid-template-columns:1fr}
  .rep-row{grid-template-columns:1fr 1fr}
  .ad-servicos{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.head-actions,.tour,.toast{display:none!important}
  .main{margin:0}
  .card{box-shadow:none}
}

/* ===================== CRIATIVA · espaço público ===================== */
.pub-top{display:none}
body.modo-pub .pub-top{display:block;position:sticky;top:0;z-index:25;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body.modo-pub .sidebar,body.modo-pub .topbar{display:none}
body.modo-pub .main{margin-left:0}
body.modo-pub .content{max-width:none;padding:0}
.pub-in{max-width:1240px;margin:0 auto;height:66px;padding:0 24px;display:flex;align-items:center;gap:20px}
.pub-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.pub-brand .brand-mark{width:36px;height:36px}
.pub-brand b{display:block;font-size:16px;letter-spacing:.16em;line-height:1.1}
.pub-brand small{display:block;font-size:11px;color:var(--subtle)}
.pub-nav{display:flex;gap:4px;margin-right:auto}
.pub-nav a{padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:none}
.pub-nav a:hover,.pub-nav a.on{background:var(--soft);color:var(--ink)}
.seg-sm button{padding:5px 9px;font-size:12px}
.pub-wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.pub-dentro .pub-wrap{padding:0}
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:520px;height:520px;right:-140px;top:-230px;border:1px solid rgba(216,238,106,.18);box-shadow:0 0 0 40px rgba(216,238,106,.03),0 0 0 84px rgba(216,238,106,.03)}
.hero:after{width:300px;height:300px;right:220px;bottom:-200px;border:1px solid rgba(17,168,149,.25)}
.hero-in{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:54px 24px 46px}
.pub-dentro .hero{border-radius:var(--r)}
.pub-dentro .hero-in{padding:40px 32px}
.hero h1{font-size:44px;line-height:1.06;letter-spacing:-.04em;margin:14px 0 12px;max-width:760px;font-weight:800}
.hero p{color:#c3d3d5;font-size:16px;max-width:640px;margin:0 0 22px}
.hero-search{display:flex;gap:8px;max-width:640px}
.hero-search input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px 16px;font-size:15px}
.hero-search .btn{padding:0 18px;border-radius:12px}
.hero-stats{display:flex;gap:22px;margin-top:20px;color:#a9bfc2;font-size:13px;flex-wrap:wrap}
.hero-stats b{color:#fff;font-size:18px;margin-right:4px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard-body{padding:14px 16px 16px;display:grid;gap:8px}
.pcard h3{margin:0;font-size:16.5px;letter-spacing:-.01em}
.pcard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.pcard-foot{display:flex;justify-content:space-between;gap:8px}
.pcard-foot svg.i{width:14px;height:14px;vertical-align:-2px}
.mini{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--mb-bg)}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.mini .m-b{fill:var(--mb-a)}.mini .m-c{fill:var(--mb-b);opacity:.85}
.mini span{position:absolute;left:14px;bottom:10px;font-weight:800;font-size:26px;letter-spacing:.04em;color:var(--mb-t)}
.mini-lg{aspect-ratio:auto;min-height:220px;border-radius:var(--r) 0 0 var(--r)}
.mini-lg span{font-size:44px;left:22px;bottom:16px}
.mini-sea{--mb-bg:#dff3ee;--mb-a:#11a895;--mb-b:#0c2735;--mb-t:#0c2735}
.mini-amber{--mb-bg:#fff3dc;--mb-a:#e7a13d;--mb-b:#ab3f27;--mb-t:#5b3407}
.mini-coral{--mb-bg:#fdeee9;--mb-a:#de7057;--mb-b:#0c2735;--mb-t:#5c1f12}
.mini-blue{--mb-bg:#e9efff;--mb-a:#5475bd;--mb-b:#11a895;--mb-t:#1f2f5c}
.mini-lime{--mb-bg:#f4f9df;--mb-a:#c5dc55;--mb-b:#0c2735;--mb-t:#33400a}
.tag-sea{background:var(--sea-bg);color:var(--sea-ink)}.tag-amber{background:var(--amber-bg);color:var(--amber-ink)}.tag-coral{background:var(--coral-bg);color:var(--coral-ink)}.tag-blue{background:var(--blue-bg);color:var(--blue-ink)}.tag-lime{background:var(--lime-bg);color:#4d5a12}
.perfil-head{display:grid;grid-template-columns:minmax(220px,340px) 1fr;overflow:hidden}
.perfil-info{padding:24px 26px}
.perfil-info h1{font-size:32px;letter-spacing:-.035em;margin:8px 0 6px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.oferta{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.oferta h3{margin:0;font-size:15px}
.oferta p{margin:0;font-size:13px;color:var(--muted)}
.login-pub{min-height:calc(100vh - 66px);display:flex;align-items:center;justify-content:center;padding:30px 20px;background:var(--ink);position:relative;overflow:hidden}
.pub-dentro .login-pub{min-height:auto;border-radius:var(--r)}
.login-pub .login-card{position:relative;z-index:1;width:min(420px,100%);background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);padding:30px 28px 22px}
.heat{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:7px;font-weight:800;font-size:12.5px;background:rgba(17,168,149,calc(var(--a)*.85 + .06));color:var(--ink)}
/* início público — linguagem editorial/territorial (referência Manus) */
.hero-sm .hero-in{padding:36px 24px 30px}.hero-sm h1{font-size:34px}
.mh{--mp:#f6f4ee;--mink:#172b34;--msea:#176b70;--msea-d:#0e454d;--msand:#e8dfcf;--mnavy:#142b35;--serif:Georgia,"Times New Roman",serif;background:var(--mp);color:var(--mink)}
.mh-in{max-width:1240px;margin:0 auto;padding:0 32px}
.mh-kicker,.mh-eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--msea)}
.mh-hero{position:relative;min-height:640px;height:min(780px,calc(100vh - 66px));display:flex;align-items:center;color:#fff;background:#294b52 var(--foto) center 48%/cover no-repeat;overflow:hidden}
.mh-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,37,45,.8) 0%,rgba(13,37,45,.52) 48%,rgba(13,37,45,.08) 100%),linear-gradient(0deg,rgba(13,37,45,.42),transparent 40%)}
.mh-hero-in{position:relative;z-index:1;width:100%;padding-top:40px;padding-bottom:70px}
.mh-hero .mh-eyebrow{color:#d9e7e1}
.mh-hero h1{font:400 clamp(44px,6.4vw,86px)/.98 var(--serif);letter-spacing:-.04em;max-width:820px;margin:18px 0 16px}
.mh-lead{color:#e6ece8;font-size:16px;margin:0 0 30px}
.mh-search{background:#fff;color:var(--mink);width:min(760px,100%);padding:8px;border-radius:13px;display:flex;align-items:center;box-shadow:0 18px 60px rgba(9,36,42,.32)}
.mh-lupa{padding:0 10px 0 12px;color:var(--msea);display:grid}.mh-lupa svg.i{width:18px;height:18px}
.mh-search input{border:0;outline:0;min-width:0;flex:1;padding:13px 4px;background:transparent;font-size:16px}
.mh-btn,.mh-btn-out,.mh-btn-light{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:800;font-size:14.5px;text-decoration:none;white-space:nowrap;cursor:pointer}

.ades-opcao:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ades-opcao .link{margin-top:4px}
.ades-passos{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ades-passos button{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:750;color:var(--muted);text-align:left}
.ades-passos button span{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:#eef3f2;font-size:11.5px}
.ades-passos button[aria-current]{border-color:var(--ink);color:var(--ink)}
.ades-passos button[aria-current] span{background:var(--ink);color:var(--lime)}
.ades-passos button.feito span{background:var(--sea);color:#fff}
.ades-passos button[disabled]{opacity:.55;cursor:default}
.ades-etapa[hidden],.ades-nav [hidden]{display:none}
/* ---------- quadro de oportunidades e painel ---------- */
.conn{position:relative}
.conn-link{display:grid;gap:8px;text-decoration:none;color:inherit;min-width:0}
.conn-link .tag{white-space:normal}
.conn[draggable="true"]{cursor:grab}
.conn[draggable="true"]:active{cursor:grabbing}
.conn-mover{padding:5px 8px;font-size:12px;border-radius:8px;width:100%}
.col.alvo{outline:2px dashed var(--sea);outline-offset:-4px;background:#e2f1ee}
.head-actions .conn-mover{width:auto;padding:8px 10px;font-size:13px}
.painel-atencao{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.ades-etapa h2{grid-column:1/-1;margin:0}
.ades-etapa h2:focus{outline:none}
@media(max-width:700px){.ades-passos{grid-template-columns:1fr 1fr}.ades-nav #ades-pos{display:none}}
/* ---------- vitrine fotográfica ---------- */
.vit-foto-head{overflow:hidden}
.vit-capa{position:relative;aspect-ratio:16/5;min-height:200px;background:var(--soft)}
.vit-capa>img:first-child{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vit-capa>.mini{position:absolute;inset:0;aspect-ratio:auto;min-height:0;border-radius:0}
.vit-logo{position:absolute;left:24px;bottom:-38px;width:88px;height:88px;border-radius:18px;object-fit:cover;border:4px solid #fff;background:#fff;box-shadow:var(--shadow);z-index:1}
.vit-foto-head.com-logo .perfil-info{padding-top:50px}
.oferta-img{width:calc(100% + 28px);max-width:none;margin:-14px -14px 4px;aspect-ratio:4/3;object-fit:cover;border-radius:13px 13px 0 0;display:block}
.vit-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.vit-galeria figure{margin:0;display:grid;gap:6px}
.vit-galeria img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.vit-galeria figcaption{font-size:12.5px;color:var(--muted)}
.pcard-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
@media(max-width:860px){.vit-capa{aspect-ratio:16/9;min-height:0}.vit-logo{left:16px;width:72px;height:72px;bottom:-30px}.vit-foto-head.com-logo .perfil-info{padding-top:42px}}
/* ---------- editor de imagens ---------- */
.img-slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.img-slot{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px}
.img-thumb{width:104px;height:78px;border-radius:8px;background:var(--soft);border:1px dashed var(--line2);display:grid;place-items:center;color:var(--subtle);font-size:11.5px;overflow:hidden}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.img-item{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start}
.img-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.img-item .btn{justify-self:start}
.img-add{border:1px dashed var(--line2);border-radius:12px;display:grid;place-items:center;min-height:140px;padding:10px}
.img-alt{width:100%;padding:7px 9px;font-size:12.5px}
.img-arquivo{position:relative;cursor:pointer}
.img-arquivo:focus-within{outline:2px solid var(--sea-ink);outline-offset:2px}
.of-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
@media(max-width:860px){.img-slots{grid-template-columns:1fr}}
/* ---------- minha vitrine e prévia ---------- */
.mv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,1fr);gap:16px;align-items:start}
.mv-previa{position:sticky;top:80px;padding:16px;display:grid;gap:12px}
.mv-moldura{max-height:calc(100vh - 230px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.mv-moldura.mobile{width:min(330px,100%);margin:0 auto;border:8px solid var(--ink);border-radius:26px}
.mv-palco{position:relative;overflow:hidden}
.mv-palco iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:var(--paper)}
@media(max-width:1180px){.mv-grid{grid-template-columns:1fr}.mv-previa{position:static}.mv-moldura{max-height:75vh}}
/* ---------- Vitória: conversa guiada ---------- */
.vit{padding:0;overflow:hidden}
.vit-modal{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vit-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--soft)}
.vit-head b{display:block;font-size:15px}.vit-head small{display:block;color:var(--subtle);font-size:12px}
.vit-head #vit-prog{margin-left:auto;white-space:nowrap}
.vit-av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:800;flex:none}
.vit-log{display:flex;flex-direction:column;gap:10px;padding:18px;max-height:min(52vh,520px);min-height:180px;overflow:auto}
.vit-msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.vit-v{align-self:flex-start;background:#eef4f3;color:var(--ink);border-top-left-radius:4px}
.vit-u{align-self:flex-end;background:var(--ink);color:#fff;border-top-right-radius:4px}
.vit-resp{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.vit-form{display:flex;gap:8px;align-items:flex-end}
.vit-form input,.vit-form textarea,.vit-form select{flex:1;min-width:0}
.vit-opcoes{display:flex;flex-wrap:wrap;gap:8px}
.vit-multi{border:0;padding:0;margin:0}
.vit-resumo{display:grid;gap:0;margin:0;padding:0;list-style:none}
.vit-resumo li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px}
.vit-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 18px 14px;flex-wrap:wrap;border-top:1px solid var(--line)}
@media(max-width:600px){.vit-form{flex-direction:column;align-items:stretch}.vit-msg{max-width:92%}.vit-head #vit-prog{display:none}}

/* ---------- auditoria ---------- */

  const f = $(sel); const o = {};

const pageHead = (over, titulo, sub, acoes) => `<div class="page-head"><div>${over ? `<div class="overline">${over}</div>` : ''}<h1>${titulo}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${acoes ? `<div class="head-actions">${acoes}</div>` : ''}</div>`;

    const r = b.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
    t.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    t.style.top = (r.top - h - 8 >= 8 ? r.top - h - 8 : r.bottom + 8) + 'px'; };
  const esconder = () => { if (tip) tip.hidden = true; $$('.ii.on').forEach(b => b.classList.remove('on')); fixo = null; };

const vazio = (t, s) => `<div class="empty"><b>${t}</b>${s || ''}</div>`;
const barra = (partes, total) => `<div class="bar" role="img" aria-label="${partes.map(p => p[2] + ': ' + p[1]).join(', ')}">${partes.filter(p => p[1]).map(p => `<span class="${p[0]}" style="width:${total ? p[1] * 100 / total : 0}%"></span>`).join('')}</div>`;
const pips = (n, t) => `<span class="pips" aria-label="${n} de ${t}">${Array.from({ length: t }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
/* ---------- exportação ---------- */
function baixar(nome, conteudo, tipo) {
  const blob = new Blob([conteudo], { type: tipo || 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200);
}
const csvCampo = v => { const s = v == null ? '' : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const paraCSV = (cab, linhas) => '﻿' + [cab.join(';')].concat(linhas.map(l => l.map(csvCampo).join(';'))).join('\n');

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function diaRef() { return new Date(Date.now() - 3 * 36e5).toISOString().slice(0, 10); } // dia de referência no fuso de Brasília
function ordenarVisibilidade(lista) {
  const dia = diaRef();
  const segs = uniq(lista.map(p => p.segmento)).sort((a, b) => hashStr(dia + a) - hashStr(dia + b));
  const filas = segs.map(s => lista.filter(p => p.segmento === s).sort((a, b) => (a.impressoes || 0) - (b.impressoes || 0) || hashStr(dia + a.id) - hashStr(dia + b.id)));
  const out = []; let i = 0;
  while (out.length < lista.length) { filas.forEach(f => { if (f[i]) out.push(f[i]); }); i++; }
  return out;
}
function textoBusca(p) { return norm([p.nome, p.descricao, p.narrativa, p.tecnica, nomeSeg(p.segmento), nomeCat(p.categoria), (p.tags || []).join(' '), ofertasDe(p).map(o => o.nome + ' ' + o.descricao + ' ' + (o.descricaoEn || '') + ' ' + (o.material || '')).join(' ')].join(' ')); }
function buscarParticipantes(f) {
  const termos = norm(f.q || '').split(/\s+/).filter(t => t.length >= 2);
  let l = visiveis().filter(p => termos.every(t => textoBusca(p).includes(t.length > 4 ? t.slice(0, t.length - 1) : t)));
  if (f.seg) l = l.filter(p => p.segmento === f.seg);
  if (f.mod) l = l.filter(p => (p.modalidades || []).includes(f.mod));
  if (f.idioma) l = l.filter(p => (p.idiomas || []).includes(f.idioma));
  return ordenarVisibilidade(l);
}

function registrarBusca(f, n) {

  const ult = DB.buscas[DB.buscas.length - 1];

function completude(p) {
  const it = [!!p.nome, !!p.segmento, !!p.categoria, !!(p.narrativa && p.narrativa.length > 40), !!(p.vinculo || []).length, !!(p.modalidades || []).length, ofertasDe(p).length > 0, ofertasDe(p).every(o => o.descricao && o.descricao.length > 15), !!(p.contato && (p.contato.email || p.contato.whatsapp)), !!p.consentimento, (p.idiomas || []).length > 0];
  return { feitos: it.filter(Boolean).length, total: it.length };

const JANELA = { inicio: '2027-03-31', fim: '2027-04-18' };

function indicadores() {
  const ps = DB.participantes.filter(p => p.status !== 'inativo');
  const ops = DB.oportunidades;
  const imp = ps.reduce((s, p) => s + (p.impressoes || 0), 0), vis = ps.reduce((s, p) => s + (p.visualizacoes || 0), 0);
  const qual = ops.filter(qualificada);
  const PASSOS = ['respondida', 'conversa', 'resultado'];
  const comPasso = qual.filter(o => o.historico.some(h => PASSOS.includes(h.para)));
  const sinais = ops.filter(o => !qualificada(o));
  const continuidade = qual.filter(o => o.historico.some(h => PASSOS.includes(h.para)) || (o.followUps || []).length || o.proximoPasso);
  const evol = qual.filter(o => ['conversa', 'resultado'].includes(o.estagio) || o.historico.some(h => h.para === 'conversa'));
  const res = qual.filter(o => o.estagio === 'resultado');
  const sem = qual.filter(o => o.estagio === 'encerrada');
  const tempos = comPasso.map(o => diasEntre(o.em, o.historico.find(h => PASSOS.includes(h.para)).em)).filter(x => x != null);
  const tempoMedio = tempos.length ? Math.round(tempos.reduce((a, b) => a + b, 0) / tempos.length * 10) / 10 : null;
  const posEvento = qual.filter(o => (o.followUps || []).some(f => f.em.slice(0, 10) > JANELA.fim) || (o.historico || []).some(h => h.em.slice(0, 10) > JANELA.fim));
  const sorted = ps.map(p => p.impressoes || 0).sort((a, b) => b - a); const top = sorted.slice(0, Math.max(1, Math.ceil(sorted.length * 0.2))).reduce((a, b) => a + b, 0);
  const concentracao = imp ? Math.round(top * 100 / imp) : 0;
  const porSeg = DB.taxonomia.segmentos.map(s => { const pp = ps.filter(p => p.segmento === s.id); const oo = ops.filter(o => (partPorId(o.partId) || {}).segmento === s.id); return { seg: s, part: pp.length, imp: pp.reduce((a, p) => a + (p.impressoes || 0), 0), vis: pp.reduce((a, p) => a + (p.visualizacoes || 0), 0), qual: oo.filter(qualificada).length, res: oo.filter(o => o.estagio === 'resultado').length }; });
  const porOrigem = Object.keys(ORIGEM).map(k => { const oo = ops.filter(o => o.origem === k); return { k, n: oo.length, qual: oo.filter(qualificada).length, res: oo.filter(o => o.estagio === 'resultado').length }; });
  const motivos = {}; sem.forEach(o => { if (o.motivo) motivos[o.motivo] = (motivos[o.motivo] || 0) + 1; });
  const barreiras = {}; (DB.barreiras || []).forEach(b => { barreiras[b.tipo] = (barreiras[b.tipo] || 0) + 1; });
  const semResultado = {}; DB.buscas.filter(b => !b.resultados).forEach(b => { const k = norm(b.termo); semResultado[k] = semResultado[k] || { termo: b.termo, n: 0 }; semResultado[k].n++; });
  const termos = {}; DB.buscas.forEach(b => { const k = norm(b.termo); termos[k] = termos[k] || { termo: b.termo, n: 0, res: b.resultados }; termos[k].n++; });
  const altaAtencao = ps.filter(p => (p.visualizacoes || 0) >= 40).map(p => ({ p, vis: p.visualizacoes, qual: ops.filter(o => o.partId === p.id && qualificada(o)).length, res: ops.filter(o => o.partId === p.id && o.estagio === 'resultado').length })).filter(x => x.res <= 1 && x.qual <= 3).sort((a, b) => b.vis - a.vis);
  const poucoVistos = ps.filter(p => (p.impressoes || 0) < imp / ps.length * 0.6).map(p => ({ p, imp: p.impressoes || 0, demanda: DB.buscas.filter(b => b.resultados && textoBusca(p).includes(norm(b.termo).split(' ')[0])).length })).filter(x => x.demanda > 0).sort((a, b) => b.demanda - a.demanda);
  const valor = res.filter(o => o.resultado && o.resultado.valor > 0 && o.resultado.valorPublicoAgregado !== false).reduce((s, o) => s + o.resultado.valor, 0);
  const comp = ps.map(completude); const compMedia = comp.length ? Math.round(comp.reduce((s, c) => s + c.feitos / c.total, 0) / comp.length * 100) : 0;
  const fim30 = new Date(new Date(JANELA.fim + 'T12:00:00Z').getTime() + 30 * 864e5).toISOString().slice(0, 10);
  const followUp30 = qual.filter(o => (o.followUps || []).concat(o.historico || []).some(h => h.em.slice(0, 10) > JANELA.fim && h.em.slice(0, 10) <= fim30));
  return { ps, ops, imp, vis, qual, comPasso, sinais, continuidade, followUp30, evol, res, sem, tempoMedio, posEvento, concentracao, porSeg, porOrigem, motivos, barreiras, semResultado: Object.values(semResultado).sort((a, b) => b.n - a.n), termos: Object.values(termos).sort((a, b) => b.n - a.n), altaAtencao, poucoVistos, valor, compMedia,
    consentidas: ops.filter(o => o.consentimento && o.contato).length, assistidos: ps.filter(p => ['baixa', 'assistida'].includes(p.maturidade)).length };
}

/* ---------- miniatura gerada por segmento (sem fotos de terceiros) ---------- */
function miniatura(p, grande) {
  const seg = segPorId(p.segmento) || { cor: 'sea' }; const h = hashStr(p.id + p.nome);
  const ini = p.nome.replace(/^(Ateliê|Oficina|Estúdio|Coletivo|Galeria|Doceria|Bordados)\s+/i, '').split(/\s+/).filter(w => w.length > 2).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const forma = h % 3;
  const shapes = forma === 0 ? `<circle cx="${70 + h % 40}" cy="${30 + h % 20}" r="46" class="m-b"/><circle cx="${20 + h % 30}" cy="90" r="30" class="m-c"/>`
    : forma === 1 ? `<path d="M0 ${60 + h % 20} Q 40 ${30 + h % 30} 80 ${60 + h % 10} T 160 ${50 + h % 20} V120 H0Z" class="m-b"/><path d="M0 ${85 + h % 10} Q 50 ${65 + h % 20} 100 ${88} T 160 ${80} V120 H0Z" class="m-c"/>`
    : `<rect x="${10 + h % 30}" y="14" width="64" height="64" rx="10" class="m-b" transform="rotate(${h % 30 - 15} 60 50)"/><circle cx="${110 + h % 20}" cy="${70 + h % 20}" r="26" class="m-c"/>`;
  return `<div class="mini mini-${seg.cor} ${grande ? 'mini-lg' : ''}" aria-hidden="true"><svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice">${shapes}</svg><span>${esc(ini)}</span></div>`;
}

   Campos opcionais do participante: formatoVitrine, capa, logo, galeria, autorizacaoImagens.
   Campo opcional da oferta: imagens. Ausentes (bases antigas) = vitrine simples, sem imagens. */
const FORMATO_VITRINE = { simples: 'Vitrine simples', fotografica: 'Vitrine fotográfica' };
const formatoDe = p => p.formatoVitrine === 'fotografica' ? 'fotografica' : 'simples';
const imagensDe = p => ({ capa: p.capa || null, logo: p.logo || null, galeria: Array.isArray(p.galeria) ? p.galeria : [] });
const imagensOferta = o => Array.isArray(o.imagens) ? o.imagens : [];
const LIM_IMG = { capa: 1400, logo: 400, galeria: 1000, oferta: 900 };
const MAX_IMG = { galeria: 6, oferta: 3 };

/* foto do card na descoberta e no início: só quando o participante escolheu a vitrine fotográfica e tem capa */
const capaCard = (p, cls) => formatoDe(p) === 'fotografica' && p.capa ? `<img class="${cls || ''}" src="${esc(p.capa.src)}" alt="" loading="lazy">` : '';
function reduzirImagem(file, max) {
  return new Promise((ok, falha) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('Imagem ilegível.')); };
    img.src = url;
  });
}

App.enviarInteresse = pid => {
  const o = lerForm('#f-int'); const en = S.lang === 'en';
  if (o.exige) { const er = {}; if (!o.nome) er.nome = en ? 'Provide your name.' : 'Informe seu nome.'; if (!o.contato) er.contato = en ? 'Provide an e-mail or WhatsApp.' : 'Informe e-mail ou WhatsApp.'; else if (!contatoValido(o.contato)) er.contato = en ? 'Invalid contact.' : 'Contato inválido.'; if (!o.mensagem) er.mensagem = en ? 'Tell us what you need.' : 'Conte o que você precisa.'; if (!o.consentimento) er.consentimento = en ? 'Needed so the maker can reply.' : 'Necessário para que a resposta chegue até você.'; if (Object.keys(er).length) { marcarErros('#f-int', er); return; } }
  if (o.consentimento && !o.contato) { marcarErros('#f-int', { contato: en ? 'Provide an e-mail or WhatsApp.' : 'Informe e-mail ou WhatsApp.' }); return; }
  if (o.contato && !contatoValido(o.contato)) { marcarErros('#f-int', { contato: en ? 'Invalid contact.' : 'Contato inválido.' }); return; }

  DB.oportunidades.push(op);
  DB.auditoria.unshift({ id: 'aud-' + (DB.seq.aud = (DB.seq.aud || 0) + 1), em: nowISO(), por: S.perfil === 'publico' ? 'Formulário público' : usuarioAtual().nome, perfil: S.perfil, acao: 'Registro de interesse', modulo: 'Oportunidades', entidade: 'oportunidade', entidadeId: id, descricao: `${id} (${partPorId(pid).nome}): ${TIPO_INTERACAO[o.tipo].l}${qualificada(op) ? ' — interação qualificada' : ' — sinal de interesse'} · origem ${ORIGEM[op.origem]}.`, antes: null, depois: null });

  if (S.perfil !== 'publico') App.render();

};

  const visita = en
    ? ['Search by product, technique or maker, or browse by creative sector.', 'Open a profile to see, in the maker’s own words, what they offer and how they work.', 'Found something? Contact the maker directly when they share a contact, or send a quote request or partnership proposal. The maker receives it and replies. No account needed.']

App.corrigirEstagio = (id, novo) => {

function aprendizadoOp(o) {
  const p = partPorId(o.partId); const itens = [];

  if (o.estagio === 'resultado' && o.resultado) itens.push(`Desfecho: <b>${esc(TIPO_RESULTADO[o.resultado.tipo])}</b> — soma aos resultados por canal e segmento${['b2b', 'contratacao', 'parceria'].includes(o.resultado.tipo) ? ' e aos canais B2B iniciados' : ''}.`);

    itens.push(rec ? `Alimenta a recomendação candidata <a class="link" href="#/recomendacoes">“${esc(rec.tema)}”</a> · ${esc(STATUS_REC[(dl || {}).status || 'para_analise'].l)}.` : 'Ainda não há evidência suficiente para recomendação (mínimo de duas no tema).');
  }
  if (['nova', 'respondida', 'conversa'].includes(o.estagio) && qualificada(o)) itens.push('Em acompanhamento: o próximo passo, os registros pós-evento e o desfecho (resultado ou motivo) entram nos indicadores municipais.');
  return `<section class="card card-pad learn" id="op-aprendizado"><div class="overline">O que isto ensinou à Prefeitura</div><ul>${itens.map(x => `<li>${x}</li>`).join('')}</ul></section>`;

/* ---------- relatório PDF de inteligência: layout próprio, não é impressão da tela ----------
   Gerado no navegador com jsPDF (biblioteca aberta, carregada de cdnjs só quando o relatório é pedido).
   Usa apenas dados agregados: nenhum nome de interessado, contato ou documento. */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function carregarJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((ok, falha) => {
    const s = document.createElement('script'); s.src = JSPDF_URL; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
    s.onload = () => (window.jspdf && window.jspdf.jsPDF ? ok(window.jspdf.jsPDF) : falha(new Error('jsPDF indisponível')));
    s.onerror = () => { s.remove(); falha(new Error('jsPDF não carregou')); };
    document.head.appendChild(s);
  });
}
/* QR Code da vitrine: reutiliza a rota pública #/p/<id>. Só gera com endereço público (nunca localhost ou arquivo local).
   Ao publicar a plataforma, preencha PUBLICACAO.url (ex.: 'https://criativa.exemplo.gov.br/') ou abra-a já no endereço público. */
const PUBLICACAO = { url: '' };
function urlPublicaVitrine(pid) {
  let base = PUBLICACAO.url;
  if (!base) {
    const h = location.hostname;
    if (!/^https?:$/.test(location.protocol) || !h || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h.endsWith('.local') || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h)) return '';
    base = location.origin + location.pathname;
  }
  return base.replace(/#.*$/, '') + '#/p/' + pid;
}
const QR_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
function carregarQR() {
  if (window.QRCode) return Promise.resolve(window.QRCode);
  return new Promise((ok, falha) => {
    const s = document.createElement('script'); s.src = QR_URL; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
    s.onload = () => (window.QRCode ? ok(window.QRCode) : falha(new Error('QR indisponível')));
    s.onerror = () => { s.remove(); falha(new Error('QR não carregou')); };
    document.head.appendChild(s);
  });
}
App.qrVitrine = async pid => {
  const p = partPorId(pid); const url = urlPublicaVitrine(pid);
  if (!url) return App.modal({ title: 'QR Code da vitrine', sub: esc(p.nome), body: '<p class="muted" style="margin:0">Disponível quando a plataforma estiver publicada em um endereço público.</p>' });
  App.modal({ title: 'QR Code da vitrine', sub: esc(p.nome), body: `<div class="stack" style="align-items:center;text-align:center"><div id="qr-box" style="background:#fff;padding:12px;border-radius:8px;min-height:244px;min-width:244px"></div><p class="small mono" style="word-break:break-all;margin:0">${esc(url)}</p><button type="button" class="btn btn-sm" id="qr-baixar" disabled>${icon('download')}Baixar PNG</button></div>` });
  try {
    const QR = await carregarQR(); const box = $('#qr-box'); if (!box) return;
    new QR(box, { text: url, width: 220, height: 220, correctLevel: QR.CorrectLevel.M });
    const c = $('canvas', box), b = $('#qr-baixar');
    if (c && b) { b.disabled = false; b.onclick = () => { const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `qr-vitrine-${pid}.png`; document.body.appendChild(a); a.click(); a.remove(); }; }
  } catch (e) { const box = $('#qr-box'); if (box) box.innerHTML = '<p class="subtle">Não foi possível gerar o QR Code agora.</p>'; }
};

App.trocarBase = v => App.confirm('Trocar base', `Carregar ${v === 'vazia' ? 'base vazia' : esc(BASE_NOME)}? A base atual deste navegador será substituída.`, 'Carregar', () => { if (v === 'vazia') { DB = baseVazia(); DB.usuarios.push({ id: 'u-3', nome: 'Representante (vincular)', email: 'participante@vitryx.demo', perfil: 'participante', partId: null, ativo: false }); auditar('Nova implantação', 'Base', 'base', null, 'Base vazia criada.'); store.save(); } else carregarCenario(); App.closeModal(); App.render(); App.toast('Base carregada.'); });

App.boot();
</script>
